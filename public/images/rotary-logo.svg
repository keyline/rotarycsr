<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Rotary International">
  <!-- Wordmark -->
  <text x="0" y="128" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="108" fill="#17458F">Rotary</text>

  <!-- Gear emblem -->
  <g transform="translate(370,0)">
    <defs>
      <rect id="tooth" x="-11" y="-98" width="22" height="30" rx="1"/>
      <path id="rotary-arc-top" d="M 119,100 A 65,65 0 0 1 249,100" />
      <path id="rotary-arc-bottom" d="M 249,100 A 65,65 0 0 1 119,100" />
    </defs>

    <!-- Teeth via rotation -->
    <g fill="#F7A81B" transform="translate(184,100)">
      <use href="#tooth" transform="rotate(0)"/>
      <use href="#tooth" transform="rotate(15)"/>
      <use href="#tooth" transform="rotate(30)"/>
      <use href="#tooth" transform="rotate(45)"/>
      <use href="#tooth" transform="rotate(60)"/>
      <use href="#tooth" transform="rotate(75)"/>
      <use href="#tooth" transform="rotate(90)"/>
      <use href="#tooth" transform="rotate(105)"/>
      <use href="#tooth" transform="rotate(120)"/>
      <use href="#tooth" transform="rotate(135)"/>
      <use href="#tooth" transform="rotate(150)"/>
      <use href="#tooth" transform="rotate(165)"/>
      <use href="#tooth" transform="rotate(180)"/>
      <use href="#tooth" transform="rotate(195)"/>
      <use href="#tooth" transform="rotate(210)"/>
      <use href="#tooth" transform="rotate(225)"/>
      <use href="#tooth" transform="rotate(240)"/>
      <use href="#tooth" transform="rotate(255)"/>
      <use href="#tooth" transform="rotate(270)"/>
      <use href="#tooth" transform="rotate(285)"/>
      <use href="#tooth" transform="rotate(300)"/>
      <use href="#tooth" transform="rotate(315)"/>
      <use href="#tooth" transform="rotate(330)"/>
      <use href="#tooth" transform="rotate(345)"/>
    </g>

    <!-- Rim -->
    <circle cx="184" cy="100" r="80" fill="#F7A81B"/>
    <circle cx="184" cy="100" r="68" fill="#FFFFFF"/>
    <circle cx="184" cy="100" r="62" fill="#F7A81B"/>

    <!-- Hub -->
    <circle cx="184" cy="100" r="34" fill="#17458F"/>
    <circle cx="184" cy="100" r="12" fill="#F7A81B"/>

    <!-- Curved text -->
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#17458F">
      <textPath href="#rotary-arc-top" startOffset="50%" text-anchor="middle">ROTARY</textPath>
    </text>
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9" letter-spacing="1" fill="#17458F">
      <textPath href="#rotary-arc-bottom" startOffset="50%" text-anchor="middle">INTERNATIONAL</textPath>
    </text>
  </g>
</svg>
